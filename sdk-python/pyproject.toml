[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "little-actors"
version = "0.5.4"
description = "Typed Python durable actors and generated clients"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pydantic>=2.12,<3", "typing-extensions>=4.12,<5", "httpx>=0.28,<1", "websockets>=15,<17", "jsonschema>=4.23,<5", "packaging>=24,<27"]

[project.urls]
Repository = "https://github.com/TerseAI/durable-actors"
Documentation = "https://github.com/TerseAI/durable-actors/blob/main/docs/reference/python.md"

[project.optional-dependencies]
codegen = ["datamodel-code-generator>=0.83,<0.84", "mypy>=1.15,<2", "pip>=25,<27"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "mypy>=1.15,<2", "pyright>=1.1.400,<2", "ruff>=0.11,<1", "types-jsonschema", "datamodel-code-generator>=0.83,<0.84", "build>=1,<2", "pip>=25,<27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src/little_actors"]

[tool.pyright]
include = ["src/little_actors"]
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/little_actors"]
