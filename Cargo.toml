[package]
name = "durable-actors"
version = "0.7.10"
edition = "2024"
rust-version = "1.89"
default-run = "durable-actors"
description = "Standalone regional durable-actors control plane, host, and durability runtime"
readme = "README.md"
repository = "https://github.com/TerseAI/durable-actors"
license = "MIT"
keywords = ["actors", "distributed-systems", "durable-actors", "serverless"]
categories = ["asynchronous", "network-programming"]
include = ["/third_party/terse-ltx/**", "/src/**", "/tests/**", "/proto/**", "/migrations/**", "/docs/reference/openapi.yaml", "/build.rs", "/README.md", "/LICENSE.md"]

[dependencies]
terse-ltx = { version = "0.1.0", git = "https://github.com/TerseAI/terse-ltx", rev = "fdc27e08f09a532b8f0b8d72971de4b2772ef86b" }
walkdir = "2"
kube = { version = "2.0.1", default-features = false, features = ["client", "rustls-tls", "aws-lc-rs", "runtime", "ws"] }
k8s-openapi = { version = "0.26", features = ["v1_34"] }
anstream = "1"
anstyle = "1"
futures-util = "0.3"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
axum = { version = "0.8", features = ["ws", "http2"] }
bytes = "1"
prost = "0.14"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["trace"] }
tonic = { version = "0.14", features = ["tls-aws-lc", "tls-webpki-roots"] }
tonic-prost = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
google-cloud-storage = "=1.17.0"
google-cloud-auth = "1.15.0"
anyhow = "1.0.104"
async-trait = "0.1.92"
atomic-write-file = "0.3.1"
aws-lc-rs = { version = "1.18.0", default-features = false, features = ["non-fips"] }
base64 = "0.22.1"
jsonwebtoken = { version = "10.4", default-features = false, features = ["aws_lc_rs"] }
refinery = { version = "0.9.2", features = ["tokio-postgres"] }
subtle = "2.6"
uuid = { version = "1", features = ["v4"] }
native-tls = "0.2"
postgres-native-tls = "0.5"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
deadpool-postgres = "0.14"
moka = { version = "0.12", features = ["future"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup"], default-features = false }
gcp_auth = { version = "0.12.7", default-features = false, features = ["aws-lc-rs"] }
memmap2 = "0.9"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", features = ["process"] }
