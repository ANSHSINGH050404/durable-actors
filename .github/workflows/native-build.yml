name: Build native runtimes

on:
    workflow_call:

permissions:
    contents: read

jobs:
    build:
        name: Build native runtime (${{ matrix.runner }})
        strategy:
            fail-fast: false
            matrix:
                # Blacksmith macOS runners are ARM64; retain GitHub's Intel runner.
                runner: [blacksmith-4vcpu-ubuntu-2204, blacksmith-4vcpu-ubuntu-2204-arm, blacksmith-6vcpu-macos-15, macos-15-intel]
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  submodules: recursive
                  ref: ${{ github.sha }}
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "22.19.0"
            - name: Install Rust toolchain
              run: rustup toolchain install 1.89.0 --profile minimal && rustup default 1.89.0
            - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
              with:
                  shared-key: native-${{ matrix.runner }}
                  save-if: ${{ github.ref == 'refs/heads/main' }}
            - name: Build Rust runtime
              run: node scripts/build-runtime.mjs
            - name: Check the native executable
              run: target/release/durable-actors --version
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: native-${{ matrix.runner }}
                  path: dist-runtime/*
                  if-no-files-found: error
                  retention-days: 7
