name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    python:
        uses: ./.github/workflows/python.yml

    image:
        name: Runtime image (${{ matrix.arch }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: amd64
                      platform: linux/amd64
                      runner: blacksmith-4vcpu-ubuntu-2404
                    - arch: arm64
                      platform: linux/arm64
                      runner: blacksmith-4vcpu-ubuntu-2404-arm
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up Blacksmith Docker builder
              uses: useblacksmith/setup-docker-builder@a5256a73e30f09e37e3eceb8ca36043d17621d24 # v2.1.0
              with:
                  cache-key: durable-actors/runtime-${{ matrix.arch }}
                  nofallback: false
                  platforms: ${{ matrix.platform }}
            - name: Build runtime image
              uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
              with:
                  context: .
                  platforms: ${{ matrix.platform }}
                  load: true
                  tags: durable-actors:ci
            - name: Check the image executable
              run: |
                  docker run --rm durable-actors:ci --version
                  docker run --rm --entrypoint python3 -v "$PWD/sdk-python/tests/fixtures/image_smoke.py:/tmp/image_smoke.py:ro" durable-actors:ci /tmp/image_smoke.py

    rust:
        name: Rust runtime (Bun ${{ matrix.bun }})
        strategy:
            fail-fast: false
            matrix:
                bun: ["1.3.9", "1.4.2"]
        runs-on: blacksmith-4vcpu-ubuntu-2404
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: durable_actors_test
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_USER: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d durable_actors_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Install Rust toolchain
              run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt && rustup default 1.89.0
            - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
              with:
                  shared-key: validation-ubuntu-24.04
                  save-if: ${{ github.ref == 'refs/heads/main' }}
            - name: Install pinned Litestream
              run: |
                  node scripts/litestream.mjs "$RUNNER_TEMP/litestream"
                  printf '%s\n' "$RUNNER_TEMP/litestream" >> "$GITHUB_PATH"
            - name: Check formatting
              run: cargo fmt --all -- --check
            - name: Run tests
              env:
                  DURABLE_ACTORS_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/durable_actors_test?sslmode=disable
              run: cargo test --locked --no-fail-fast
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  version: 10.17.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "22.19.0"
                  cache: pnpm
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ matrix.bun }}
            - run: pnpm install --frozen-lockfile
            - run: pnpm --dir sdk build
            - name: Check packaged actors on the supported Bun versions
              run: node --test sdk/tests/scripts/build-artifact.test.mjs
            - run: cargo build --locked
            - name: Run WebSocket and restart integration tests
              run: cargo test --locked -- --ignored
            - name: Check the Express and React example
              working-directory: examples/chat
              run: |
                  node ../../sdk/dist/cli.js generate src/actors.ts
                  npm run build
            - name: Check the AI chat example
              working-directory: examples/ai-chat
              run: npm run build
            - name: Check the documents example
              working-directory: examples/documents
              run: |
                  node ../../sdk/dist/cli.js generate src/actors.ts
                  npm run build

    npm:
        name: TypeScript package
        runs-on: blacksmith-4vcpu-ubuntu-2404
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  version: 10.17.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "22.19.0"
                  cache: pnpm
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.2"
            - run: pnpm install --frozen-lockfile
            - run: pnpm --dir sdk format:check
            - run: pnpm --dir packages/observer-ui format:check
            - run: pnpm --dir packages/observer-ui test
            - name: Install pinned Litestream
              run: |
                  node scripts/litestream.mjs "$RUNNER_TEMP/litestream"
                  printf '%s\n' "$RUNNER_TEMP/litestream" >> "$GITHUB_PATH"
            - run: pnpm --dir sdk test
            - name: Validate HTTP and build TypeScript documentation
              run: pnpm docs:build
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: typescript-api
                  path: .artifacts/api
                  include-hidden-files: true
                  if-no-files-found: error
            - run: pnpm --dir packages/observer-ui package:check
            - name: Verify npm package
              working-directory: sdk
              run: npm pack --dry-run

    helm:
        name: Kubernetes chart
        runs-on: blacksmith-4vcpu-ubuntu-2404
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Install Helm
              run: |
                  curl -fsSLO https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
                  curl -fsSLO https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz.sha256sum
                  sha256sum --check helm-v3.19.0-linux-amd64.tar.gz.sha256sum
                  tar -xzf helm-v3.19.0-linux-amd64.tar.gz
                  sudo install linux-amd64/helm /usr/local/bin/helm
            - run: helm lint charts/terse -f charts/terse/tests/values.yaml
            - run: node --test charts/terse/tests/chart.test.mjs
            - run: helm package charts/terse --destination .artifacts/charts
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: terse-helm-chart
                  path: .artifacts/charts/*.tgz
                  include-hidden-files: true
                  if-no-files-found: error

    native:
        if: github.event_name == 'push'
        uses: ./.github/workflows/native-build.yml
