apiVersion: v1
kind: Namespace
metadata:
  name: {{ (include "actors.sandboxNamespace" .) }}
  labels:
    terse.ai/sandboxes: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox
  namespace: {{ (include "actors.sandboxNamespace" .) }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "actors.name" . }}
  namespace: {{ (include "actors.sandboxNamespace" .) }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, watch, patch, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "actors.name" . }}
  namespace: {{ (include "actors.sandboxNamespace" .) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "actors.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "actors.name" . }}
    namespace: {{ .Release.Namespace }}
