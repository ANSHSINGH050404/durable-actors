apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.sandboxNamespace }}
  labels:
    terse.ai/sandboxes: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox
  namespace: {{ .Values.sandboxNamespace }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "terse.name" . }}
  namespace: {{ .Values.sandboxNamespace }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, watch, patch, delete]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "terse.name" . }}
  namespace: {{ .Values.sandboxNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "terse.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "terse.name" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "terse.name" . }}-{{ .Release.Namespace }}-nodes
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "terse.name" . }}-{{ .Release.Namespace }}-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "terse.name" . }}-{{ .Release.Namespace }}-nodes
subjects:
  - kind: ServiceAccount
    name: {{ include "terse.name" . }}
    namespace: {{ .Release.Namespace }}
