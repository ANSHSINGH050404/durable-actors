{{- if .Values.capacityBuffer.enabled }}
{{- $name := printf "%s-capacity-buffer" (include "terse.name" .) | trunc 63 | trimSuffix "-" }}
apiVersion: v1
kind: PodTemplate
metadata:
  name: {{ $name }}
  namespace: {{ .Values.sandboxNamespace }}
template:
  spec:
    runtimeClassName: gvisor
    automountServiceAccountToken: false
    terminationGracePeriodSeconds: 0
    nodeSelector:
      sandbox.gke.io/runtime: gvisor
    tolerations:
      - key: sandbox.gke.io/runtime
        operator: Equal
        value: gvisor
        effect: NoSchedule
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: topology.kubernetes.io/zone
                  operator: In
                  values:
                    {{- index .Values.zones .Values.region | toYaml | nindent 20 }}
    securityContext:
      runAsNonRoot: true
      runAsUser: 10000
      runAsGroup: 10000
    containers:
      - name: capacity
        image: registry.k8s.io/pause:3.9
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: {{ printf "%vm" .Values.pool.cpuMillis | quote }}
            memory: {{ printf "%vMi" .Values.pool.memoryMiB | quote }}
          limits:
            cpu: {{ printf "%vm" .Values.pool.cpuMillis | quote }}
            memory: {{ printf "%vMi" .Values.pool.memoryMiB | quote }}
---
apiVersion: autoscaling.x-k8s.io/v1beta1
kind: CapacityBuffer
metadata:
  name: {{ $name }}
  namespace: {{ .Values.sandboxNamespace }}
spec:
  podTemplateRef:
    name: {{ $name }}
  replicas: {{ .Values.capacityBuffer.replicas }}
  provisioningStrategy: buffer.x-k8s.io/active-capacity
{{- end }}
