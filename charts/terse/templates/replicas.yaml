apiVersion: v1
kind: ServiceAccount
metadata:
  name: replica
  namespace: {{ .Values.sandboxNamespace }}
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.serviceAccount.googleServiceAccount | quote }}
automountServiceAccountToken: false
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "terse.name" . }}-replicas
  namespace: {{ .Values.sandboxNamespace }}
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      terse.ai/purpose: replica
      terse.ai/assigned: "true"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "terse.name" . }}-replicas
  namespace: {{ .Values.sandboxNamespace }}
spec:
  podSelector:
    matchLabels: {terse.ai/purpose: replica}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}}
          podSelector:
            matchLabels: {app.kubernetes.io/name: {{ include "terse.name" . }}}
        - podSelector:
            matchExpressions:
              - key: terse.ai/purpose
                operator: In
                values: [actor, replica]
      ports:
        - {protocol: TCP, port: 7200}
  egress:
    - to:
        - ipBlock: {cidr: 169.254.169.254/32}
      ports:
        - {protocol: TCP, port: 80}
    - to:
        - ipBlock: {cidr: 169.254.169.252/32}
      ports:
        - {protocol: TCP, port: 988}
